<table

  cellspacing="0"
  border="0"
  role="presentation"
  dir="ltr"
  style="

    mso-table-lspace: 0pt;
    mso-table-rspace: 0pt;
    font-family: Arial, Helvetica, sans-serif;

    line-height: 1.45;
    color: #333333;
    direction: ltr;

        height="97"

          outline: none;
          text-decoration: none;
          border-radius: 50%;

      />

      width="2"
      valign="middle"
      style="

        max-width: 2px;
